[project]
name = "evalaware"
version = "0.1.0"
description = "Measure how detectable AI-agent sandboxes are, benchmark models' sandbox-inference ability, and study whether agents notice and react."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # core is stdlib-only so it can run inside minimal sandboxes

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest"]

[tool.setuptools]
packages = ["evalaware", "evalaware.layers", "evalaware.study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
